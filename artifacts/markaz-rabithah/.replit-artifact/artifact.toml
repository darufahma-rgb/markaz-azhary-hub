kind = "web"
previewPath = "/"
title = "Markaz Rabithah — Brand Guideline"
version = "1.0.0"
id = "artifacts/markaz-rabithah"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22579

[services.development]
run = "pnpm --filter @workspace/markaz-rabithah run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/markaz-rabithah", "run", "build" ]
publicDir = "artifacts/markaz-rabithah/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22579"
BASE_PATH = "/"
